name: Publish Windows download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-windows-0.3.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check tested source run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/42380857902 --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42380857902 --jq '.head_sha')" = 55f6d1f6cfb466246d102ba7230d79110e9484b5
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-Windows-x64
          run-id: 42380857902
          github-token: ${{ github.token }}
          path: verified
      - name: Publish verified Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp verified/VideoPlayer-Windows.exe VideoPlayer-Windows-0.3.1-x64.exe
          echo '05a11e506b2ccc0bcbebfc27229e948d1a385be15583e930c7e65dfeb1018cc7  VideoPlayer-Windows-0.3.1-x64.exe' > SHA256-Windows-0.3.1.txt
          sha256sum -c SHA256-Windows-0.3.1.txt
          cat > release-notes.txt <<'NOTES'
          VideoPlayer 0.3.1 dla Windows 10/11 x64.
          Poprawka startu filmu: aktywacja oryginalnego przycisku Play również w ramce, bez ukrywania reklam.
          Rozszerzony raport stanów odtwarzacza, ramki i wykonania polecenia startu.
          Test Windows potwierdza uruchomienie odtwarzacza wymagającego zaufanego kliknięcia w ramce innej domeny.
          Wyszukiwanie Google w aplikacji jako awaryjne źródło kafelków, poprawne ponawianie wyszukiwania i linki embed Freedisc.
          Historia i ulubione jako kafelki, zapamiętywanie pozycji, automatyczny widok filmu na pełnym ekranie i próba autostartu.
          Spacja / Enter: Play/Pauza; lewo/prawo: 10 sekund; F11: pełny ekran; Esc: przyciski.
          Kolejny odcinek: wyszukiwanie 40 sekund przed końcem, propozycje 10 sekund przed końcem; przy potwierdzonym braku odcinka pierwszy odcinek następnego sezonu.
          CAPTCHA i zgody pozostają do ręcznego potwierdzenia. Reklamy oryginalnego odtwarzacza pozostają aktywne.
          Samodzielny EXE; wymaga Microsoft Edge WebView2 Runtime. Lokalne kolekcje Windows nie synchronizują się z Androidem.
          Testy Windows/WPF/WebView2 oraz 44 testy wspólnych skryptów przeszły na kontrolowanych stronach; dostępność serwisów wymaga sprawdzenia przez użytkownika.
          Kod aplikacji: 55f6d1f6cfb466246d102ba7230d79110e9484b5; zweryfikowany build: 42380857902.
          NOTES
          if gh release view windows-v0.3.1 >/dev/null 2>&1; then
            gh release download windows-v0.3.1 --pattern VideoPlayer-Windows-0.3.1-x64.exe --output existing.exe
            echo '05a11e506b2ccc0bcbebfc27229e948d1a385be15583e930c7e65dfeb1018cc7  existing.exe' | sha256sum -c -
          else
            gh release create windows-v0.3.1 VideoPlayer-Windows-0.3.1-x64.exe SHA256-Windows-0.3.1.txt --target "$GITHUB_SHA" --title 'VideoPlayer 0.3.1 — Windows PC' --notes-file release-notes.txt --prerelease --latest=false
          fi

