name: Publish Windows download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-windows-0.3.4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check tested source run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/42415449324 --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42415449324 --jq '.head_sha')" = 3fecf9867e24603a86d5abdbe5d19d8c98d6e4b2
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-Windows-x64
          run-id: 42415449324
          github-token: ${{ github.token }}
          path: verified
      - name: Publish verified Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp verified/VideoPlayer-Windows.exe VideoPlayer-Windows-0.3.4-x64.exe
          echo 'e5526478c200bd31e167064361d8d09e64f638fd14185ca461174b25e4fd6c1c  VideoPlayer-Windows-0.3.4-x64.exe' > SHA256-Windows-0.3.4.txt
          sha256sum -c SHA256-Windows-0.3.4.txt
          cat > release-notes.txt <<'NOTES'
          VideoPlayer 0.3.4 dla Windows 10/11 x64.
          Poprawione propozycje kolejnego odcinka: widoczne kafelki, komunikat potwierdzonego braku, oczekiwanie na kod, błąd wyszukiwania lub nierozpoznany numer odcinka.
          Rozpoznawanie nazw z podkreśleniami i kropkami, zachowanie tytułu odcinka, obsługa sygnału zakończenia z odtwarzacza.
          Test Windows sprawdza progi 40/10 sekund, kafelki, kolejny sezon i brak wyników, kod i wznowienie, błąd, nierozpoznany tytuł oraz widoczny panel po zdarzeniu końca filmu.
          Dopasowanie pełnego ekranu Freedisc także dla ramek ładowanych skryptem bez atrybutu src.
          Wewnętrzny player i zewnętrzna ramka otrzymują dopasowanie przez kanał wykrytego odtwarzacza; zachowano uruchamianie oryginalnego Play.
          Test Windows potwierdza oba poziomy dopasowania i Play przy opóźnionym ładowaniu ramki z innej domeny.
          Poprawka pełnego ekranu: wewnętrzny odtwarzacz wypełnia całe okno i dopasowuje się po zmianie rozmiaru, bez rozciągania proporcji filmu.
          Pasek logowania i ocen osadzonej strony jest ukryty w widoku filmu.
          Test WPF/WebView2 potwierdza rozmiary i położenie odtwarzacza w ramce, także po zmianie rozmiaru okna.
          Poprawka startu filmu: aktywacja oryginalnego przycisku Play również w ramce, bez ukrywania reklam.
          Rozszerzony raport stanów odtwarzacza, ramki i wykonania polecenia startu.
          Test Windows potwierdza uruchomienie odtwarzacza wymagającego zaufanego kliknięcia w ramce innej domeny.
          Wyszukiwanie Google w aplikacji jako awaryjne źródło kafelków, poprawne ponawianie wyszukiwania i linki embed Freedisc.
          Historia i ulubione jako kafelki, zapamiętywanie pozycji, automatyczny widok filmu na pełnym ekranie i próba autostartu.
          Spacja / Enter: Play/Pauza; lewo/prawo: 10 sekund; F11: pełny ekran; Esc: przyciski.
          Kolejny odcinek: wyszukiwanie 40 sekund przed końcem, propozycje 10 sekund przed końcem; przy potwierdzonym braku odcinka pierwszy odcinek następnego sezonu.
          CAPTCHA i zgody pozostają do ręcznego potwierdzenia. Reklamy oryginalnego odtwarzacza pozostają aktywne.
          Samodzielny EXE; wymaga Microsoft Edge WebView2 Runtime. Lokalne kolekcje Windows nie synchronizują się z Androidem.
          Testy Windows/WPF/WebView2 oraz 44 testy wspólnych skryptów przeszły na kontrolowanych stronach; dostępność serwisów wymaga sprawdzenia przez użytkownika.
          Kod aplikacji: 3fecf9867e24603a86d5abdbe5d19d8c98d6e4b2; zweryfikowany build: 42415449324.
          NOTES
          if gh release view windows-v0.3.4 >/dev/null 2>&1; then
            gh release download windows-v0.3.4 --pattern VideoPlayer-Windows-0.3.4-x64.exe --output existing.exe
            echo 'e5526478c200bd31e167064361d8d09e64f638fd14185ca461174b25e4fd6c1c  existing.exe' | sha256sum -c -
          else
            gh release create windows-v0.3.4 VideoPlayer-Windows-0.3.4-x64.exe SHA256-Windows-0.3.4.txt --target "$GITHUB_SHA" --title 'VideoPlayer 0.3.4 — Windows PC' --notes-file release-notes.txt --prerelease --latest=false
          fi

