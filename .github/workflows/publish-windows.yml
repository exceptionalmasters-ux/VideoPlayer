name: Publish Windows download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-windows-0.3.6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check tested source run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/42422265967 --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42422265967 --jq '.head_sha')" = 155b5808d174aabfc4e011713c64fc660028fcc3
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-Windows-x64
          run-id: 42422265967
          github-token: ${{ github.token }}
          path: verified
      - name: Publish verified Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp verified/VideoPlayer-Windows.exe VideoPlayer-Windows-0.3.6-x64.exe
          echo 'e7beee0b4f7b7c0ae6686c43f577bbe89ac6b1d4a16889af8f76940c18c73654  VideoPlayer-Windows-0.3.6-x64.exe' > SHA256-Windows-0.3.6.txt
          sha256sum -c SHA256-Windows-0.3.6.txt
          cat > release-notes.txt <<'NOTES'
          VideoPlayer 0.3.6 dla Windows 10/11 x64.
          Odbiór wiadomości i zegara filmu także z głęboko zagnieżdżonych ramek. Dopasowanie, oryginalny Play, historia i sygnał końca korzystają z właściwego poziomu odtwarzacza.
          Zegar kolejnego odcinka działa niezależnie od oczekiwania na wznowienie. Panel można otworzyć klawiszem N albo przyciskiem Następny odcinek.
          Panel pokazuje odebrany czas i stan wyszukiwania; rozszerzony raport zapisuje stan ramek i zegara bez tytułów, cookies i kodów.
          Test Windows obejmuje odtwarzacz w ramce wewnątrz drugiej ramki na różnych domenach, odbiór zegara z najgłębszego poziomu i uruchomienie propozycji.
          Poprawione wznawianie z historii: końcowy zapis przed wyjściem, pauzą i zamknięciem, przewinięcie po gotowości playera i ochrona punktu przed zerem przy ładowaniu.
          Historia pokazuje godzinę wznowienia. Film przerwany w ostatnich 10 sekundach również wznawia się; zakończony startuje od początku.
          Test WPF/WebView2 przerywa film, otwiera historię, ponownie uruchamia kafelek i sprawdza rzeczywistą pozycję playera. Testy obejmują także reklamy, opóźnione przewinięcie i trwałość po restarcie.
          Poprawione propozycje kolejnego odcinka: widoczne kafelki, komunikat potwierdzonego braku, oczekiwanie na kod, błąd wyszukiwania lub nierozpoznany numer odcinka.
          Rozpoznawanie nazw z podkreśleniami i kropkami, zachowanie tytułu odcinka, obsługa sygnału zakończenia z odtwarzacza.
          Test Windows sprawdza progi 40/10 sekund, kafelki, kolejny sezon i brak wyników, kod i wznowienie, błąd, nierozpoznany tytuł oraz widoczny panel po zdarzeniu końca filmu.
          Dopasowanie pełnego ekranu Freedisc także dla ramek ładowanych skryptem bez atrybutu src.
          Wewnętrzny player i zewnętrzna ramka otrzymują dopasowanie przez kanał wykrytego odtwarzacza; zachowano uruchamianie oryginalnego Play.
          Test Windows potwierdza oba poziomy dopasowania i Play przy opóźnionym ładowaniu ramki z innej domeny.
          Poprawka pełnego ekranu: wewnętrzny odtwarzacz wypełnia całe okno i dopasowuje się po zmianie rozmiaru, bez rozciągania proporcji filmu.
          Pasek logowania i ocen osadzonej strony jest ukryty w widoku filmu.
          Test WPF/WebView2 potwierdza rozmiary i położenie odtwarzacza w ramce, także po zmianie rozmiaru okna.
          Poprawka startu filmu: aktywacja oryginalnego przycisku Play również w ramce, bez ukrywania reklam.
          Rozszerzony raport stanów odtwarzacza, ramki i wykonania polecenia startu.
          Test Windows potwierdza uruchomienie odtwarzacza wymagającego zaufanego kliknięcia w ramce innej domeny.
          Wyszukiwanie Google w aplikacji jako awaryjne źródło kafelków, poprawne ponawianie wyszukiwania i linki embed Freedisc.
          Historia i ulubione jako kafelki, zapamiętywanie pozycji, automatyczny widok filmu na pełnym ekranie i próba autostartu.
          Spacja / Enter: Play/Pauza; lewo/prawo: 10 sekund; F11: pełny ekran; Esc: przyciski.
          Kolejny odcinek: wyszukiwanie 40 sekund przed końcem, propozycje 10 sekund przed końcem; przy potwierdzonym braku odcinka pierwszy odcinek następnego sezonu.
          CAPTCHA i zgody pozostają do ręcznego potwierdzenia. Reklamy oryginalnego odtwarzacza pozostają aktywne.
          Samodzielny EXE; wymaga Microsoft Edge WebView2 Runtime. Lokalne kolekcje Windows nie synchronizują się z Androidem.
          Testy Windows/WPF/WebView2 oraz 44 testy wspólnych skryptów przeszły na kontrolowanych stronach; dostępność serwisów wymaga sprawdzenia przez użytkownika.
          Kod aplikacji: 155b5808d174aabfc4e011713c64fc660028fcc3; zweryfikowany build: 42422265967.
          NOTES
          if gh release view windows-v0.3.6 >/dev/null 2>&1; then
            gh release download windows-v0.3.6 --pattern VideoPlayer-Windows-0.3.6-x64.exe --output existing.exe
            echo 'e7beee0b4f7b7c0ae6686c43f577bbe89ac6b1d4a16889af8f76940c18c73654  existing.exe' | sha256sum -c -
          else
            gh release create windows-v0.3.6 VideoPlayer-Windows-0.3.6-x64.exe SHA256-Windows-0.3.6.txt --target "$GITHUB_SHA" --title 'VideoPlayer 0.3.6 — Windows PC' --notes-file release-notes.txt --prerelease --latest=false
          fi

