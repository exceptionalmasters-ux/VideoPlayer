name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.8.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 42120755494
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.8.1.apk
          echo '41e08d9ef005c2cbd3c0d5a0e0d787199f3f4ed56fffd0999ee927dbc19649bd  VideoPlayer-0.8.1.apk' | sha256sum -c -
          if gh release view android-v0.8.1 >/dev/null 2>&1; then
            gh release download android-v0.8.1 --pattern VideoPlayer-0.8.1.apk --output existing.apk
            echo '41e08d9ef005c2cbd3c0d5a0e0d787199f3f4ed56fffd0999ee927dbc19649bd  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.8.1 VideoPlayer-0.8.1.apk --target "$GITHUB_SHA" --title 'VideoPlayer 0.8.1 — Android i Android TV' --notes 'Mniejsze kafelki kolejnego odcinka: wyszukiwanie 40 sekund przed końcem, propozycje 10 sekund przed końcem bez zatrzymania filmu. Kliknięcie otwiera pełny ekran i próbuje rozpocząć odtwarzanie przez oryginalny odtwarzacz. Ręczna weryfikacja kodem pozostaje aktywna. SHA-256: 41e08d9ef005c2cbd3c0d5a0e0d787199f3f4ed56fffd0999ee927dbc19649bd' --prerelease
          fi
