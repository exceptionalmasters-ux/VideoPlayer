name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.7.4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 41934109063
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.7.4.apk
          echo '37317bd8c82f9e88feaae39c6f8fd28400117aecb541ef7ce5955c8e117aa51a  VideoPlayer-0.7.4.apk' | sha256sum -c -
          if gh release view android-v0.7.4 >/dev/null 2>&1; then
            gh release download android-v0.7.4 --pattern VideoPlayer-0.7.4.apk --output existing.apk
            echo '37317bd8c82f9e88feaae39c6f8fd28400117aecb541ef7ce5955c8e117aa51a  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.7.4 VideoPlayer-0.7.4.apk --target "$GITHUB_SHA" --title 'VideoPlayer 0.7.4 — Android i Android TV' --notes 'Poprawione OK / Play na Android TV po wznowieniu filmu: pilot aktywuje widoczny, oryginalny przycisk Play bez włączania kursora. Zachowane pauza i wznowienie oraz zapisana pozycja. Test obejmuje oryginalny Play w ramce wymagający prawdziwego dotknięcia, pauzę i ponowne Play. Testy telefonu i TV przeszły. SHA-256: 37317bd8c82f9e88feaae39c6f8fd28400117aecb541ef7ce5955c8e117aa51a' --prerelease
          fi
