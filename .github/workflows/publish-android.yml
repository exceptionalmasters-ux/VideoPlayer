name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.8.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 42113174076
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.8.0.apk
          echo '4be6699d13d97bc53a7b5b8773bb887502fe8d9b4fd394052602e0f9a46105f0  VideoPlayer-0.8.0.apk' | sha256sum -c -
          if gh release view android-v0.8.0 >/dev/null 2>&1; then
            gh release download android-v0.8.0 --pattern VideoPlayer-0.8.0.apk --output existing.apk
            echo '4be6699d13d97bc53a7b5b8773bb887502fe8d9b4fd394052602e0f9a46105f0  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.8.0 VideoPlayer-0.8.0.apk --target "$GITHUB_SHA" --title 'VideoPlayer 0.8.0 — Android i Android TV' --notes 'Kolejny odcinek: wyszukiwanie około 30 sekund przed końcem, kafelki nad filmem po zakończeniu i wybór pilotem lub dotykiem. Pierwszy odcinek następnego sezonu jest sprawdzany dopiero po potwierdzonym braku kolejnego odcinka. Przy kodzie antyspamowym aplikacja czeka na ręczne wpisanie i wznawia to samo wyszukiwanie. Testy telefonu i Android TV przeszły. SHA-256: 4be6699d13d97bc53a7b5b8773bb887502fe8d9b4fd394052602e0f9a46105f0' --prerelease
          fi
