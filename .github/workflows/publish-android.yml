name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.9.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 42270284748
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.9.1.apk
          echo 'b1624a121e2e6124856de45fa6c6f7a75efdcb7ef29aa7e683e60544cda735ac  VideoPlayer-0.9.1.apk' | sha256sum -c -
          if gh release view android-v0.9.1 >/dev/null 2>&1; then
            gh release download android-v0.9.1 --pattern VideoPlayer-0.9.1.apk --output existing.apk
            echo 'b1624a121e2e6124856de45fa6c6f7a75efdcb7ef29aa7e683e60544cda735ac  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.9.1 VideoPlayer-0.9.1.apk --target "$GITHUB_SHA" --title 'VideoPlayer 0.9.1 — Android i Android TV' --notes 'Bezpośrednie Play/Pauza do ramki odtwarzacza na Android TV, również przed pełnym ekranem; ręczne sterowanie wyłącza ponawianie autostartu. Pole CAPTCHA pod obrazkiem i układ uwzględniający klawiaturę TV. Nowe żądanie przy ponownym wyszukaniu tej samej frazy. Strzałki i przyciski Góra/Dół przewijają wewnętrzne okna cookies Google. SHA-256: b1624a121e2e6124856de45fa6c6f7a75efdcb7ef29aa7e683e60544cda735ac' --prerelease
          fi
