name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.7.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 41870695607
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.7.0.apk
          echo 'de577450b371e96a7ab5f2b398ac264cc135c418fc9b934440673cc046d2759e  VideoPlayer-0.7.0.apk' | sha256sum -c -
          if gh release view android-v0.7.0 >/dev/null 2>&1; then
            gh release download android-v0.7.0 --pattern VideoPlayer-0.7.0.apk --output existing.apk
            echo 'de577450b371e96a7ab5f2b398ac264cc135c418fc9b934440673cc046d2759e  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.7.0 VideoPlayer-0.7.0.apk --target d2d4fd3dc5c48532c0b4c80e613e50e1db656715 --title 'VideoPlayer 0.7.0 — Android i Android TV' --notes 'Uniwersalny APK na telefon, tablet i Android TV. Własna historia i ulubione jako kafelki, usuwanie pozycji i czyszczenie list z potwierdzeniem. Testy telefonu i TV przeszły. SHA-256: de577450b371e96a7ab5f2b398ac264cc135c418fc9b934440673cc046d2759e' --prerelease
          fi
