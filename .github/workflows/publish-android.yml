name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.7.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 41912363622
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.7.1.apk
          echo 'c39a9baa6a85d10a8280bd1e59f8d504a87a6747e16326dda794ed07ac0a9b12  VideoPlayer-0.7.1.apk' | sha256sum -c -
          if gh release view android-v0.7.1 >/dev/null 2>&1; then
            gh release download android-v0.7.1 --pattern VideoPlayer-0.7.1.apk --output existing.apk
            echo 'c39a9baa6a85d10a8280bd1e59f8d504a87a6747e16326dda794ed07ac0a9b12  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.7.1 VideoPlayer-0.7.1.apk --target "$GITHUB_SHA" --title 'VideoPlayer 0.7.1 — Android i Android TV' --notes 'Poprawiona nawigacja pilotem przez przyciski i kafelki. Enter oraz zatwierdzenie klawiatury TV uruchamia wyszukiwanie. Czytelne pola kodu z automatycznym fokusem. Uproszczony pasek filmu: OK to pauza, lewo/prawo przewija. Opcjonalny kursor pilota. Historia i ulubione zachowane. Testy telefonu i TV przeszły. SHA-256: c39a9baa6a85d10a8280bd1e59f8d504a87a6747e16326dda794ed07ac0a9b12' --prerelease
          fi
