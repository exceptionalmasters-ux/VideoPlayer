name: Publish Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-0.8.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoPlayer-debug
          run-id: 42124930835
          github-token: ${{ github.token }}
          path: verified
      - name: Publish the verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" VideoPlayer-0.8.2.apk
          echo 'e4c654848d1b2b0deb57f5f197ed0d1d85ccb28f584e86aa199e0017c5ed0337  VideoPlayer-0.8.2.apk' | sha256sum -c -
          if gh release view android-v0.8.2 >/dev/null 2>&1; then
            gh release download android-v0.8.2 --pattern VideoPlayer-0.8.2.apk --output existing.apk
            echo 'e4c654848d1b2b0deb57f5f197ed0d1d85ccb28f584e86aa199e0017c5ed0337  existing.apk' | sha256sum -c -
          else
            gh release create android-v0.8.2 VideoPlayer-0.8.2.apk --target "$GITHUB_SHA" --title 'VideoPlayer 0.8.2 — Android i Android TV' --notes 'Ukryte dwie rozpoznane plansze reklamowe Freedisc, przy pozostawieniu ich skryptów i liczników. Autostart oczekuje na gotowość oryginalnego odtwarzacza i ponawia Play, kończąc próby po rozpoczęciu filmu lub ręcznej pauzie. Warstwy reklam Videra pozostają bez zmian. SHA-256: e4c654848d1b2b0deb57f5f197ed0d1d85ccb28f584e86aa199e0017c5ed0337' --prerelease
          fi
