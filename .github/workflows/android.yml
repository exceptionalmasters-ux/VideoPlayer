name: Android APK
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test browser scripts
        run: node --test tests/browser-scripts.test.cjs
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: videoplayer-test-signing-v2
      - name: Prepare test signing key
        shell: bash
        run: |
          if [ ! -f .ci-signing/debug.keystore ]; then
            mkdir -p .ci-signing
            keytool -genkeypair -keystore .ci-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build, unit tests and lint
        run: gradle --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature
        shell: bash
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/reports/apk-signature.txt'
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
  ui-input:
    name: Keyboard on Android 15
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: videoplayer-test-signing-v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test verification keyboard on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          pre-emulator-launch-script: python3 tools/configure_phone_emulator.py
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -memory 2048 -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell input keyevent 82
            adb shell settings put system screen_off_timeout 1800000
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell wm size
            adb shell wm density
            gradle --no-daemon --console=plain connectedDebugAndroidTest || { adb pull /sdcard/Download/videoplayer-next-episode.png app/build/reports/next-episode.png || true; adb pull /sdcard/Download/videoplayer-next-code.png app/build/reports/next-code.png || true; exit 1; }
            adb pull /sdcard/Download/videoplayer-next-episode.png app/build/reports/next-episode.png
            adb pull /sdcard/Download/videoplayer-next-code.png app/build/reports/next-code.png
      - name: Upload keyboard test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/next-episode.png
            app/build/reports/next-code.png
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
  tv-remote:
    name: Remote on Android TV 14
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Free space for Android TV userdata
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: videoplayer-test-signing-v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test D-pad on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell settings put secure tv_user_setup_complete 1
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            gradle --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=pl.example.viderplayer.TvRemoteTest,pl.example.viderplayer.AutomaticPresentationTest,pl.example.viderplayer.CollectionsTest,pl.example.viderplayer.NextEpisodeTest,pl.example.viderplayer.GoogleFallbackTest || { adb pull /sdcard/Download/videoplayer-next-episode.png app/build/reports/next-episode.png || true; adb pull /sdcard/Download/videoplayer-next-code.png app/build/reports/next-code.png || true; adb pull /sdcard/Download/videoplayer-tv.png app/build/reports/tv-results.png; exit 1; }
            adb pull /sdcard/Download/videoplayer-tv.png app/build/reports/tv-results.png
            adb pull /sdcard/Download/videoplayer-next-episode.png app/build/reports/next-episode.png
            adb pull /sdcard/Download/videoplayer-next-code.png app/build/reports/next-code.png
            adb pull /sdcard/Download/videoplayer-tv-cursor.png app/build/reports/tv-cursor.png
      - name: Upload TV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

