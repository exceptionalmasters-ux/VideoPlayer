name: Verify playback resume on TV
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tv-remote:
    name: Remote on Android TV 14
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Free space for Android TV userdata
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: videoplayer-test-signing-v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test D-pad on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell settings put secure tv_user_setup_complete 1
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            gradle --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=pl.example.viderplayer.TvRemoteTest,pl.example.viderplayer.AutomaticPresentationTest,pl.example.viderplayer.CollectionsTest || { adb pull /sdcard/Download/videoplayer-tv.png app/build/reports/tv-results.png; exit 1; }
            adb pull /sdcard/Download/videoplayer-tv.png app/build/reports/tv-results.png
            adb pull /sdcard/Download/videoplayer-tv-cursor.png app/build/reports/tv-cursor.png
      - name: Upload TV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

